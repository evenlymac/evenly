[package]
name = "evenly-tray"
version = "0.2.5"
edition = "2021"
description = "Evenly для Windows: приложение в трее (значок E, автозапуск, одна копия, en/ru, обновление APO; ставит и снимает APO установщик)."
publish = false

[dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
