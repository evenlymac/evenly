[package]
name = "live-tool"
version = "0.2.3"
edition = "2021"
description = "Evenly: играет тон на устройстве по умолчанию (WASAPI shared) и пишет loopback, печатает RMS по секундам."
publish = false

[dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Com_StructuredStorage",
] }
