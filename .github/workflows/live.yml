name: live
on:
  push:
    branches: [windows-ci]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apo-live:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[live]')
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: A download VB-Cable and trust publisher
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          Invoke-WebRequest -Uri 'https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack43.zip' -OutFile vb.zip -UseBasicParsing
          Expand-Archive vb.zip vbx -Force
          $sig = Get-AuthenticodeSignature (Resolve-Path vbx/vbaudio_cable64_win7.sys).Path
          "sig: $($sig.Status) $($sig.SignerCertificate.Subject)" | Tee-Object logs/live-a.txt
          [IO.File]::WriteAllBytes("$PWD\vb.cer", $sig.SignerCertificate.Export('Cert'))
          Import-Certificate -FilePath vb.cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-String | Tee-Object logs/live-a.txt -Append
      - name: B install driver
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          Set-Location vbx
          $p = Start-Process -FilePath "$PWD\VBCABLE_Setup_x64.exe" -ArgumentList '-i','-h' -PassThru
          if (-not $p.WaitForExit(150000)) { "setup timeout, killing" | Tee-Object ../logs/live-b.txt -Append; Stop-Process -Id $p.Id -Force } else { "setup exit $($p.ExitCode)" | Tee-Object ../logs/live-b.txt -Append }
          pnputil /add-driver "$PWD\vbMmeCable64_win7.inf" /install 2>&1 | Tee-Object ../logs/live-b.txt -Append
      - name: C report devices
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          Start-Sleep 5
          Restart-Service audiosrv -Force -ErrorAction SilentlyContinue
          Start-Sleep 4
          $o = @()
          $o += "== pnp"; $o += (Get-PnpDevice -Class MEDIA, AudioEndpoint -ErrorAction SilentlyContinue | Format-Table Status, Class, FriendlyName, InstanceId | Out-String)
          $o += "== render"; $o += (Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\MMDevices\Audio\Render' -ErrorAction SilentlyContinue | ForEach-Object { "$($_.PSChildName) state=$((Get-ItemProperty $_.PSPath).DeviceState)" })
          $o += "== setupapi"; $o += (Select-String -Path C:\Windows\INF\setupapi.dev.log -Pattern 'vbMme|VBAudio|VB-Audio|CABLE' | Select-Object -Last 40 | ForEach-Object { $_.Line })
          $o | Out-File logs/live-c.txt
      - name: D build apo dll and live-tool
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p logs
          (cd windows/apo && cargo build --release 2>&1 | tail -3)
          (cd windows/livetool && cargo build --release 2>&1 | tail -3)
      - name: E baseline (no APO)
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          & windows/livetool/target/release/live-tool.exe 8 baseline.f32 2>&1 | Tee-Object logs/live-baseline.txt
      - name: F try slots, sample audiodg during the stream
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force C:\ProgramData\Evenly | Out-Null
          $dll = (Resolve-Path windows/apo/target/release/evenly_apo.dll).Path
          $ps1 = (Resolve-Path windows/install/evenly-apo.ps1).Path
          $out = "logs/live-slots.txt"
          function W($m) { $m | Out-File -Encoding utf8 -Append -Width 400 $out }
          W ("os: " + (Get-CimInstance Win32_OperatingSystem | ForEach-Object { "$($_.Caption) $($_.Version) build $($_.BuildNumber)" }))
          W ("secure boot/ci: " + ((Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\CI\Policy' -ErrorAction SilentlyContinue | Out-String)))
          foreach ($slot in 'EFX','SFX') {
            W "=== slot $slot"
            Remove-Item C:\ProgramData\Evenly\apo.log -ErrorAction SilentlyContinue
            W (powershell -NoProfile -ExecutionPolicy Bypass -File $ps1 -Action install -Dll $dll -Slot $slot 2>&1 | Out-String)
            Start-Sleep 4
            $ep = (Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\MMDevices\Audio\Render' | Where-Object { (Get-ItemProperty $_.PSPath).DeviceState -eq 1 }).PSChildName
            foreach ($e in $ep) {
              $base = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\MMDevices\Audio\Render\$e"
              W "endpoint $e"
              W ("Properties: " + ((Get-ItemProperty "$base\Properties" | Format-List | Out-String)))
              W ("FxProperties: " + ((Get-ItemProperty "$base\FxProperties" | Format-List | Out-String)))
            }
            $job = Start-Process -FilePath (Resolve-Path windows/livetool/target/release/live-tool.exe).Path -ArgumentList '14',"$slot.f32" -RedirectStandardOutput "logs/live-$slot-tool.txt" -PassThru -NoNewWindow
            Start-Sleep 6
            $ad = Get-Process audiodg -ErrorAction SilentlyContinue
            W ("audiodg pid: " + (($ad | ForEach-Object Id) -join ','))
            $m = $ad | ForEach-Object { $_.Modules | ForEach-Object { $_.FileName } }
            W ("audiodg modules during stream (non-system32): " + (($m | Where-Object { $_ -notmatch '\\Windows\\(System32|SysWOW64|WinSxS)' }) -join '; '))
            W ("evenly loaded: " + (@($m | Where-Object { $_ -match 'evenly' }).Count -gt 0))
            W ("all module count: " + @($m).Count)
            W ("apodll-like modules: " + (($m | Where-Object { $_ -match 'apo|audio|fx|eff' } | ForEach-Object { Split-Path $_ -Leaf }) -join ', '))
            $job | Wait-Process -Timeout 20 -ErrorAction SilentlyContinue
            W "apo.log:"
            W (Get-Content C:\ProgramData\Evenly\apo.log -ErrorAction SilentlyContinue | Select-Object -Last 20 | Out-String)
            W (powershell -NoProfile -ExecutionPolicy Bypass -File $ps1 -Action uninstall 2>&1 | Out-String)
            Start-Sleep 3
          }
      - name: G collect events
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          foreach ($log in 'Microsoft-Windows-CodeIntegrity/Operational','Microsoft-Windows-Audio/Operational','Microsoft-Windows-Audio/PlaybackManager','Application','System') {
            "=== $log" | Out-File -Encoding utf8 -Append logs/live-events.txt
            Get-WinEvent -FilterHashtable @{LogName=$log; StartTime=(Get-Date).AddMinutes(-25)} -ErrorAction SilentlyContinue | Where-Object { $log -notin 'Application','System' -or $_.ProviderName -match 'Application Error|Windows Error Reporting|audio|Audio|evenly|Service Control' } | Select-Object -First 25 TimeCreated, Id, ProviderName, Message | Format-List | Out-String -Width 300 | Out-File -Encoding utf8 -Append logs/live-events.txt
          }
          "done" | Out-File logs/live-done.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: logs-apo-live, path: logs }
      - name: push results to ci-results
        if: always()
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p work && cd work
          git init -q
          git config user.name ci && git config user.email ci@example.com
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          if git fetch -q origin ci-results; then git checkout -q -B ci-results FETCH_HEAD; else git checkout -q --orphan ci-results; fi
          d="runs/${SHA:0:7}-live"
          mkdir -p "$d"
          cp -r ../logs/. "$d"/ 2>/dev/null || true
          echo "sha=$SHA" > "$d/summary.txt"
          git add -A && git commit -q -m "ci live results ${SHA:0:7}"
          git push -q origin ci-results || { git pull -q --rebase origin ci-results && git push -q origin ci-results; }
