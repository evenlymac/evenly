name: windows
on:
  push:
    branches: [windows-ci]
  workflow_dispatch:
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: never
jobs:
  golden:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[core]')
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: gen golden (Swift)
        run: |
          mkdir -p out logs
          swiftc -O Sources/EvenlyDSP/Compressor.swift core/golden/swift/main.swift -o out/gen 2>&1 | tee logs/golden-build.txt
          cp core/golden/scenarios.json out/
          ./out/gen core/golden/scenarios.json out 2>&1 | tee logs/golden-gen.txt
      - uses: actions/upload-artifact@v4
        with: { name: golden, path: out/*.f32 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: logs-golden, path: logs }
  core:
    needs: golden
    runs-on: windows-latest
    timeout-minutes: 15
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: golden, path: golden-out }
      - name: cargo test (core vs Swift golden)
        run: |
          mkdir -p logs
          cp core/golden/scenarios.json golden-out/
          cd core
          set -o pipefail
          EVENLY_GOLDEN_DIR="$GITHUB_WORKSPACE/golden-out" cargo test -- --nocapture 2>&1 | tee ../logs/core-test.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: logs-core, path: logs }
  apo:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - name: build apo dll and harness
        run: |
          mkdir -p logs
          set -o pipefail
          (cd windows/apo && cargo build --release 2>&1) | tee logs/apo-build.txt
          (cd windows/harness && cargo build --release 2>&1) | tee logs/harness-build.txt
      - name: run harness (aggregation as audiodg does it)
        run: |
          mkdir -p /c/ProgramData/Evenly
          rm -f /c/ProgramData/Evenly/apo.log
          set +e
          ./windows/harness/target/release/apo-harness.exe "$(cygpath -w "$PWD/windows/apo/target/release/evenly_apo.dll")" 2>&1 | tee logs/harness-run.txt
          echo "exit=${PIPESTATUS[0]}" | tee -a logs/harness-run.txt
          cp /c/ProgramData/Evenly/apo.log logs/apo.log 2>/dev/null || echo "no apo.log" > logs/apo.log
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: logs-apo, path: logs }
  apo-live:
    needs: apo
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: probe audio stack and install virtual device
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          $log = "logs/live-probe.txt"
          function L($m) { $m | Out-String | Tee-Object -FilePath $log -Append }
          L "== services"; L (Get-Service audiosrv, AudioEndpointBuilder | Format-Table Name, Status, StartType | Out-String)
          L "== audio pnp before"; L (Get-PnpDevice -Class MEDIA, AudioEndpoint -ErrorAction SilentlyContinue | Format-Table Status, Class, FriendlyName | Out-String)
          try {
            New-Item -ItemType Directory -Force vb | Out-Null
            Invoke-WebRequest -Uri 'https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack43.zip' -OutFile vb/pack.zip -UseBasicParsing
            Expand-Archive vb/pack.zip vb/x -Force
            L "== vb files"; L (Get-ChildItem vb/x | Format-Table Name, Length | Out-String)
            $sys = Get-ChildItem vb/x -Filter 'vbaudio_cable64_win10.sys' | Select-Object -First 1
            $sig = Get-AuthenticodeSignature $sys.FullName
            L "== sig: $($sig.Status) $($sig.SignerCertificate.Subject)"
            $cer = 'vb/signer.cer'; Export-Certificate -Cert $sig.SignerCertificate -FilePath $cer | Out-Null
            Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
            Push-Location vb/x
            $p = Start-Process -FilePath .\VBCABLE_Setup_x64.exe -ArgumentList '-i','-h' -Wait -PassThru
            L "== setup exit: $($p.ExitCode)"
            Pop-Location
          } catch { L "== vb install error: $_" }
          Start-Sleep 5
          Start-Service audiosrv -ErrorAction SilentlyContinue
          Start-Sleep 3
          L "== audio pnp after"; L (Get-PnpDevice -Class MEDIA, AudioEndpoint -ErrorAction SilentlyContinue | Format-Table Status, Class, FriendlyName, InstanceId | Out-String)
          L "== render endpoints"; L (Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\MMDevices\Audio\Render' -ErrorAction SilentlyContinue | ForEach-Object { "$($_.PSChildName) state=$((Get-ItemProperty $_.PSPath).DeviceState)" } | Out-String)
          L "== setupapi tail"; L ((Get-Content C:\Windows\INF\setupapi.dev.log -Tail 60 -ErrorAction SilentlyContinue) -join "`n")
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: logs-apo-live, path: logs }
  report:
    needs: [golden, core, apo, apo-live]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "logs-*", path: logs, merge-multiple: true }
        continue-on-error: true
      - name: push results to ci-results
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p work && cd work
          git init -q
          git config user.name ci && git config user.email ci@example.com
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          if git fetch -q origin ci-results; then git checkout -q -B ci-results FETCH_HEAD; else git checkout -q --orphan ci-results; fi
          d="runs/${SHA:0:7}"
          mkdir -p "$d"
          cp -r ../logs/. "$d"/ 2>/dev/null || true
          printf 'sha=%s\ngolden=%s\ncore=%s\napo=%s\napo_live=%s\nrun=%s\n' "$SHA" "${{ needs.golden.result }}" "${{ needs.core.result }}" "${{ needs.apo.result }}" "${{ needs.apo-live.result }}" "${{ github.run_id }}" > "$d/summary.txt"
          git add -A && git commit -q -m "ci results ${SHA:0:7}"
          git push -q origin ci-results || { git pull -q --rebase origin ci-results && git push -q origin ci-results; }
